name: Imagen Docker

# Publica la imagen en GitHub Container Registry (ghcr.io):
#   - cada push a master        -> :master y :sha-<commit>
#   - cada etiqueta vX.Y.Z      -> :X.Y.Z, :X.Y y :latest
# En los pull requests solo se construye, para comprobar que funciona
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/hotelnube-api

jobs:
  imagen:
    name: Construir y publicar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=hotelnube-api
            org.opencontainers.image.description=API de datos geográficos y plantillas de correo de Hotel Nube

      - name: Construir (y publicar fuera de los PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
